services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: brightpath-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: brightpath
      POSTGRES_PASSWORD: brightpath_dev
      POSTGRES_DB: brightpath
    ports:
      - "5433:5432"
    volumes:
      - brightpath_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brightpath -d brightpath"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: brightpath-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - brightpath_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  brightpath_pg:
  brightpath_redis:
